name: Build PokeHabit Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Never silently generate a new signing key: that would break in-place updates.
      - name: Restore persistent Android signing key
        env:
          POKEHABIT_KEYSTORE_B64: ${{ secrets.POKEHABIT_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$POKEHABIT_KEYSTORE_B64" ]; then
            echo '::error::Missing POKEHABIT_DEBUG_KEYSTORE_B64 repository secret. Run scripts/prepare-signing.sh from Codespaces, then rerun.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$POKEHABIT_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo 'Persistent debug signing key restored.'
      - name: Compile Android Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PokeHabit-wrapper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
