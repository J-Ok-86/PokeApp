name: Build PokeHabit Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore fixed Android signing key
        env:
          POKEHABIT_KEYSTORE_B64: ${{ secrets.POKEHABIT_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$POKEHABIT_KEYSTORE_B64" ]; then
            echo '::error::POKEHABIT_DEBUG_KEYSTORE_B64 missing. Reuse original saved secret; never replace it just for a build.'
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/pokehabit-stable-signing.keystore"
          printf '%s' "$POKEHABIT_KEYSTORE_B64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          keytool -list -keystore "$KEY_FILE" -storepass android -alias androiddebugkey >/dev/null
          echo "POKEHABIT_SIGNING_KEYSTORE=$KEY_FILE" >> "$GITHUB_ENV"
          EXPECTED=$(keytool -exportcert -keystore "$KEY_FILE" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | awk '{print $1}')
          echo "POKEHABIT_EXPECTED_CERT_SHA256=$EXPECTED" >> "$GITHUB_ENV"
          echo "Fixed signing certificate SHA-256: $EXPECTED"
      - name: Compile Android APK with explicit signingConfig
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify that APK uses EXACT fixed signing key
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK/build-tools" ]; then
            echo '::error::Android SDK build-tools unavailable for signature verification.'
            exit 1
          fi
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo '::error::apksigner unavailable; refusing unverified APK.'
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
          echo "Expected fixed key SHA-256: $POKEHABIT_EXPECTED_CERT_SHA256"
          echo "APK signer SHA-256:          $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$POKEHABIT_EXPECTED_CERT_SHA256" ]; then
            echo '::error::APK certificate does NOT match the fixed keystore. Artifact upload blocked.'
            exit 1
          fi
          echo 'VERIFIED: APK was signed with the fixed keystore.'
      - uses: actions/upload-artifact@v4
        with:
          name: PokeHabit-wrapper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
